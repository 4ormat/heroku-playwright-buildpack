name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
permissions:
  contents: read
jobs:
  test_ubuntu_18:
    runs-on: ubuntu-18.04
    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - run: bash test/run.sh
      env:
        STACK: heroku-18 
  test_ubuntu_20:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - run: bash test/run.sh
      env:
        STACK: heroku-20 
