name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - stack: heroku-22
          runner: ubuntu-22.04
        - stack: heroku-24
          runner: ubuntu-24.04
    name: test (${{ matrix.stack }})
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: bash test/run.sh
      env:
        STACK: ${{ matrix.stack }}
